name: Hassfest

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

.github/workflows/hacs.yml
name: HACS Validation

# This repo hosts two independent HACS categories: the Integration
# (custom_components/simple_inventory_structure) and the Plugin (the four
# built Lovelace cards, released as inventory-structure-suite.zip — see
# release.yml). Both are validated here since a user can add this repo to
# HACS as either category.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  hacs-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hacs-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: plugin

.github/workflows/release.yml
name: Release

# Builds the four card bundles and publishes them as a GitHub Release
# whenever a "vX.Y.Z" tag is pushed — HACS (Plugin category) downloads
# `inventory-structure-suite.zip` from the release, per hacs.json's
# "zip_release"/"filename". The individual dist/*.js files are attached
# too, for anyone installing by hand without HACS.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run build

      - name: Package plugin zip
        run: |
          cd dist
          zip -r ../inventory-structure-suite.zip .
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            inventory-structure-suite.zip
            dist/inventory-list-card.js
            dist/inventory-add-card.js
            dist/inventory-view-card.js
            dist/inventory-structure-card.js
          generate_release_notes: true
